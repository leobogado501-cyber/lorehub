<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>LoreHub Online</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body style="background:#111; color:white; font-family:sans-serif; text-align:center;">

    <h2>LoreHub - Chat Real</h2>
    <div id="pantalla" style="height:300px; border:1px solid #6200ee; overflow-y:auto; background:#000; margin:20px; padding:10px; text-align:left;"></div>
    
    <input type="text" id="mensaje" placeholder="Escribí acá..." style="padding:10px; width:60%;">
    <button onclick="enviar()" style="padding:10px; background:#6200ee; color:white; border:none;">Enviar</button>

    <script>
        // Esta es la conexión con TU Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCbN6FjiEseA4RMohY1fcldDdl6qB2zalA",
            authDomain: "lorehub-bb826.firebaseapp.com",
            projectId: "lorehub-bb826",
            storageBucket: "lorehub-bb826.firebasestorage.app",
            messagingSenderId: "869041299496",
            appId: "1:869041299496:web:64711cba1e6d32bfc151d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Función para enviar mensajes
        function enviar() {
            const txt = document.getElementById('mensaje').value;
            if(txt != "") {
                db.collection("mensajes").add({ texto: txt, hora: Date.now() });
                document.getElementById('mensaje').value = "";
            }
        }

        // Función para leer mensajes en vivo
        db.collection("mensajes").orderBy("hora").onSnapshot((puntos) => {
            const pantalla = document.getElementById('pantalla');
            pantalla.innerHTML = "";
            puntos.forEach((doc) => {
                pantalla.innerHTML += `<p><b>Usuario:</b> ${doc.data().texto}</p>`;
            });
            pantalla.scrollTop = pantalla.scrollHeight;
        });
    </script>
</body>
</html>
